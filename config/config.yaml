dataset:
  # Relative to this config file.
  path: ../data/ciciomt.csv.bz2
  compression: bz2
  target_column: binary
  drop_columns:
    - attack
    - category
  label_mapping:
    Benign: 0
    Attack: 1

training:
  test_size: 0.2
  random_state: 42
  # Stratified random sample from the full dataset; includes both classes.
  # null uses all rows, which makes KNN and kernel SVM much more expensive.
  max_samples: 50000

models:
  random_forest:
    n_estimators: 200
    class_weight: balanced
    n_jobs: -1
  knn:
    n_neighbors: 5
    weights: distance
    n_jobs: -1
  svm:
    kernel: rbf
    C: 1.0
    gamma: scale
    class_weight: balanced
    cache_size: 512
